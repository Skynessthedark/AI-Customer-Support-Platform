server:
  port: 8083

services:
  company:
    url: http://localhost:8081
    endpoints:
      company-by-id: /api/company/{id}
      knowledge-version-increment: /api/company/{id}/increase-knowledge-version
  company-document:
    url: http://localhost:8082
    endpoints: 
      upload: /api/company-document/upload
      similar-context: /api/company-document/similar-context
      
spring:
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/