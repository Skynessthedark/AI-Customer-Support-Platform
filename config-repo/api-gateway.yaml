server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: company-service
              uri: lb://COMPANY-SERVICE
              predicates:
                - Path=/api/company/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter:
                      replenishRate: 5
                      burstCapacity: 10
                    key-resolver: "#{@companyKeyResolver}"
            - id: company-document-service
              uri: lb://COMPANY-DOCUMENT-SERVICE
              predicates:
                - Path=/api/company-document/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter:
                      replenishRate: 5
                      burstCapacity: 10
                    key-resolver: "#{@companyKeyResolver}"
            - id: chat-service
              uri: lb://CHAT-SERVICE
              predicates:
                - Path=/api/chat/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter:
                      replenishRate: 5
                      burstCapacity: 10
                    key-resolver: "#{@userAndCompanyKeyResolver}"
