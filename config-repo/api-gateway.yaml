server:
  port: 8080
      
spring:
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: company-service
              # uri: lb://company-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/company/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter:
                      replenishRate: 5
                      burstCapacity: 10
                    key-resolver: "#{@companyKeyResolver}"
            - id: company-document-service
              # uri: lb://company-document-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/company-document/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter:
                      replenishRate: 5
                      burstCapacity: 10
                    key-resolver: "#{@companyKeyResolver}"
            - id: chat-service
              # uri: lb://company-document-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/chat/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter:
                      replenishRate: 5
                      burstCapacity: 10
                    key-resolver: "#{@userAndCompanyKeyResolver}"
