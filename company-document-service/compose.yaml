services:
  pgvector:
    image: 'pgvector/pgvector:pg16'
    container_name: pgvector_company_document_container
    environment:
      - 'POSTGRES_DB=${PS_DB_NAME}'
      - 'POSTGRES_PASSWORD=${PS_DB_PASSWORD}'
      - 'POSTGRES_USER=${PS_DB_USER}'
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5433:5432'
    networks:
      - db_network
    volumes:
      - company_document_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_company_document_container
    restart: always
    ports:
      - "5052:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    networks:
      - db_network
    volumes:
      - pgadmin_company_document_data:/var/lib/pgadmin

networks:
  db_network:
    driver: bridge

volumes:
  company_document_data:
    driver: local
  companydocumentservice_ps_data:
    driver: local
  pgadmin_company_document_data:
    driver: local