services:
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    networks:
      - db_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

networks:
  db_network:
    driver: bridge

volumes:
  pgadmin_data:
    driver: local